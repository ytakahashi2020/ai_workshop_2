<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みんなのひとことボード</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: min(680px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 28px;
    }

    .form-card,
    .post {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .form-card {
      padding: 20px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d8dce5;
      border-radius: 9px;
      font: inherit;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus {
      border-color: #6b7cff;
    }

    input {
      margin-bottom: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .message-count {
      text-align: right;
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #5b6ee1;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #4c5fd0;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      min-height: 22px;
      margin: 0 0 16px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .post {
      padding: 17px 18px;
    }

    .post-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .post-name {
      font-weight: 700;
      word-break: break-word;
    }

    .post-date {
      flex-shrink: 0;
      color: #888;
      font-size: 12px;
    }

    .post-message {
      margin: 0;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 24px;
    }

    @media (max-width: 480px) {
      .container {
        width: min(100% - 20px, 680px);
        padding-top: 22px;
      }

      h1 {
        font-size: 24px;
      }

      .form-card {
        padding: 16px;
      }

      .post-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>みんなのひとことボード</h1>

    <section class="form-card">
      <label for="name">名前</label>
      <input id="name" type="text" maxlength="50" placeholder="名前を入力">

      <label for="message">ひとこと</label>
      <textarea id="message" maxlength="140" placeholder="ひとこと入力してください"></textarea>
      <div class="message-count"><span id="count">0</span> / 140</div>

      <button id="submitButton" type="button">投稿する</button>
    </section>

    <div id="status" aria-live="polite"></div>
    <section id="postList" class="post-list"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://lnljciifhksqcoxnyvvc.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ywneKyNYpLHScaxSlx_img_JINjCk1b";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const nameInput = document.getElementById("name");
    const messageInput = document.getElementById("message");
    const count = document.getElementById("count");
    const submitButton = document.getElementById("submitButton");
    const status = document.getElementById("status");
    const postList = document.getElementById("postList");

    messageInput.addEventListener("input", () => {
      count.textContent = messageInput.value.length;
    });

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text ?? "";
      return div.innerHTML;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    async function loadPosts() {
      status.textContent = "読み込み中…";
      postList.innerHTML = "";

      const { data, error } = await client
        .from("posts")
        .select("name, message, created_at")
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) {
        console.error(error);
        status.textContent = "読み込みに失敗しました。";
        return;
      }

      status.textContent = "";

      if (!data || data.length === 0) {
        postList.innerHTML = '<div class="empty">まだ投稿はありません。</div>';
        return;
      }

      postList.innerHTML = data.map(post => `
        <article class="post">
          <div class="post-header">
            <span class="post-name">${escapeHtml(post.name)}</span>
            <time class="post-date">${formatDate(post.created_at)}</time>
          </div>
          <p class="post-message">${escapeHtml(post.message)}</p>
        </article>
      `).join("");
    }

    async function submitPost() {
      const name = nameInput.value.trim();
      const message = messageInput.value.trim();

      if (!name) {
        status.textContent = "名前を入力してください。";
        nameInput.focus();
        return;
      }

      if (!message) {
        status.textContent = "ひとことを入力してください。";
        messageInput.focus();
        return;
      }

      if (message.length > 140) {
        status.textContent = "ひとことは140文字以内で入力してください。";
        return;
      }

      submitButton.disabled = true;
      status.textContent = "投稿中…";

      const { error } = await client
        .from("posts")
        .insert({
          name: name,
          message: message
        });

      if (error) {
        console.error(error);
        status.textContent = "投稿に失敗しました。";
        submitButton.disabled = false;
        return;
      }

      nameInput.value = "";
      messageInput.value = "";
      count.textContent = "0";

      await loadPosts();
      submitButton.disabled = false;
    }

    submitButton.addEventListener("click", submitPost);

    messageInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        submitPost();
      }
    });

    loadPosts();
  </script>
</body>
</html>
